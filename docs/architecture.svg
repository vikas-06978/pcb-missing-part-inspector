<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 900" width="1180" height="900"
     font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6e8bff"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5a6e8c"/>
    </marker>
    <marker id="arrowBrand" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6e8bff"/>
    </marker>
  </defs>

  <rect width="1180" height="900" rx="16" fill="#0b1018"/>

  <!-- ============ title ============ -->
  <text x="40" y="52" fill="#e9eff8" font-size="25" font-weight="650"
        letter-spacing="-0.4">PCB Missing-Component Inspector</text>
  <text x="40" y="78" fill="#7e8ea6" font-size="14">
    Golden-board comparison · one reference photo · no training data · no network at runtime
  </text>
  <rect x="965" y="33" width="175" height="30" rx="15" fill="rgba(110,139,255,0.14)" stroke="#3b4e74"/>
  <text x="1052" y="52" fill="#9db0ff" font-size="12.5" font-weight="600"
        text-anchor="middle">runs on 127.0.0.1 only</text>

  <!-- ============ browser layer ============ -->
  <rect x="40" y="104" width="1100" height="120" rx="14" fill="#0f1724" stroke="#22304a"/>
  <text x="62" y="130" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">
    BROWSER — web/   ·   no CDN, no web font, no build step
  </text>

  <g font-size="12.5">
    <rect x="62" y="144" width="150" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="137" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">index.html</text>
    <text x="137" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">3 screens + dialogs</text>

    <rect x="224" y="144" width="166" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="307" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">annotator.js</text>
    <text x="307" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">draw · resize · undo</text>

    <rect x="402" y="144" width="166" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="485" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">results.js</text>
    <text x="485" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">verdicts · evidence</text>

    <rect x="580" y="144" width="150" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="655" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">view.js</text>
    <text x="655" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">pan · zoom · DPR</text>

    <rect x="742" y="144" width="150" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="817" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">app.js</text>
    <text x="817" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">shell · navigation</text>

    <rect x="904" y="144" width="214" height="60" rx="9" fill="#16202f" stroke="#2a3a55"/>
    <text x="1011" y="167" fill="#e2e9f4" text-anchor="middle" font-weight="600">api.js · ui.js</text>
    <text x="1011" y="186" fill="#7e8ea6" text-anchor="middle" font-size="11">fetch · toasts · dialogs</text>
  </g>

  <!-- browser -> api -->
  <line x1="590" y1="224" x2="590" y2="266" stroke="#5a6e8c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <text x="604" y="250" fill="#7e8ea6" font-size="11.5">
    multipart upload  →   JSON verdicts  ·  PNG crops
  </text>

  <!-- ============ api layer ============ -->
  <rect x="40" y="272" width="1100" height="96" rx="14" fill="#0f1724" stroke="#22304a"/>
  <text x="62" y="298" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">
    HTTP API — app/main.py (FastAPI)
  </text>
  <g font-size="12" fill="#cdd8e8">
    <rect x="62" y="312" width="196" height="38" rx="8" fill="#16202f" stroke="#2a3a55"/>
    <text x="160" y="336" text-anchor="middle">POST /api/project/reference</text>

    <rect x="270" y="312" width="166" height="38" rx="8" fill="#16202f" stroke="#2a3a55"/>
    <text x="353" y="336" text-anchor="middle">PUT /api/project/parts</text>

    <rect x="448" y="312" width="176" height="38" rx="8" fill="#16202f" stroke="#2a3a55"/>
    <text x="536" y="336" text-anchor="middle">POST /api/project/suggest</text>

    <rect x="636" y="312" width="150" height="38" rx="8" fill="rgba(110,139,255,0.15)" stroke="#4a5f8c"/>
    <text x="711" y="336" text-anchor="middle" fill="#bcc9ff" font-weight="600">POST /api/inspect</text>

    <rect x="798" y="312" width="150" height="38" rx="8" fill="#16202f" stroke="#2a3a55"/>
    <text x="873" y="336" text-anchor="middle">GET /api/runs/…</text>

    <rect x="960" y="312" width="158" height="38" rx="8" fill="#16202f" stroke="#2a3a55"/>
    <text x="1039" y="336" text-anchor="middle">GET /static/…</text>
  </g>

  <!-- api -> storage / vision -->
  <path d="M220 368 L220 404" stroke="#5a6e8c" stroke-width="1.8" marker-end="url(#arrow)"/>
  <path d="M711 368 L711 404" stroke="#6e8bff" stroke-width="2" marker-end="url(#arrowBrand)"/>

  <!-- ============ support column ============ -->
  <rect x="40" y="410" width="360" height="330" rx="14" fill="#0f1724" stroke="#22304a"/>
  <text x="62" y="436" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">
    SUPPORT
  </text>

  <rect x="62" y="452" width="316" height="86" rx="10" fill="#16202f" stroke="#2a3a55"/>
  <text x="80" y="476" fill="#e2e9f4" font-size="13.5" font-weight="650">app/imaging.py</text>
  <text x="80" y="498" fill="#8798b0" font-size="11.5">decode · EXIF orientation · working size</text>
  <text x="80" y="518" fill="#8798b0" font-size="11.5">fit test frame to the reference raster</text>

  <rect x="62" y="550" width="316" height="106" rx="10" fill="#16202f" stroke="#2a3a55"/>
  <text x="80" y="574" fill="#e2e9f4" font-size="13.5" font-weight="650">app/storage.py</text>
  <text x="80" y="596" fill="#8798b0" font-size="11.5">projects · parts · inspection runs</text>
  <text x="80" y="616" fill="#8798b0" font-size="11.5">atomic JSON writes, plain PNG files</text>
  <text x="80" y="636" fill="#8798b0" font-size="11.5">export / import a configured board</text>

  <rect x="62" y="668" width="316" height="52" rx="10" fill="#16202f" stroke="#2a3a55"/>
  <text x="80" y="692" fill="#e2e9f4" font-size="13.5" font-weight="650">app/config.py</text>
  <text x="80" y="710" fill="#8798b0" font-size="11.5">every number that decides a verdict</text>

  <!-- ============ vision pipeline ============ -->
  <rect x="424" y="410" width="716" height="330" rx="14" fill="#0f1724" stroke="#2c3c5c"/>
  <text x="446" y="436" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">
    INSPECTION ENGINE — app/vision/   ·   pure NumPy, no HTTP, no storage
  </text>

  <g>
    <rect x="446" y="452" width="672" height="48" rx="9" fill="#16202f" stroke="#38507a"/>
    <circle cx="470" cy="476" r="11" fill="url(#brand)"/>
    <text x="470" y="480" fill="#0b1018" font-size="12" font-weight="700" text-anchor="middle">1</text>
    <text x="492" y="472" fill="#e2e9f4" font-size="13" font-weight="650">registration.py</text>
    <text x="620" y="472" fill="#8798b0" font-size="11.5">SIFT + RANSAC → plausibility check → ECC → identity</text>
    <text x="492" y="490" fill="#6f8099" font-size="11">quality = overlap after warping, not inlier ratio</text>

    <line x1="782" y1="500" x2="782" y2="514" stroke="#5a6e8c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="446" y="516" width="672" height="48" rx="9" fill="#16202f" stroke="#38507a"/>
    <circle cx="470" cy="540" r="11" fill="url(#brand)"/>
    <text x="470" y="544" fill="#0b1018" font-size="12" font-weight="700" text-anchor="middle">2</text>
    <text x="492" y="536" fill="#e2e9f4" font-size="13" font-weight="650">photometric.py</text>
    <text x="620" y="536" fill="#8798b0" font-size="11.5">robust exposure match  ·  sharpness equalisation</text>
    <text x="492" y="554" fill="#6f8099" font-size="11">only compare information both images actually contain</text>

    <line x1="782" y1="564" x2="782" y2="578" stroke="#5a6e8c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="446" y="580" width="672" height="62" rx="9" fill="#16202f" stroke="#38507a"/>
    <circle cx="470" cy="604" r="11" fill="url(#brand)"/>
    <text x="470" y="608" fill="#0b1018" font-size="12" font-weight="700" text-anchor="middle">3</text>
    <text x="492" y="600" fill="#e2e9f4" font-size="13" font-weight="650">metrics.py</text>
    <text x="620" y="600" fill="#8798b0" font-size="11.5">six independent evidence channels, per named box</text>
    <g font-size="10.5" fill="#9db0ff">
      <rect x="492" y="612" width="92" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="538" y="626" text-anchor="middle">correlation</text>
      <rect x="590" y="612" width="60" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="620" y="626" text-anchor="middle">SSIM</text>
      <rect x="656" y="612" width="72" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="692" y="626" text-anchor="middle">outline</text>
      <rect x="734" y="612" width="72" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="770" y="626" text-anchor="middle">chroma</text>
      <rect x="812" y="612" width="72" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="848" y="626" text-anchor="middle">texture</text>
      <rect x="890" y="612" width="80" height="20" rx="10" fill="rgba(110,139,255,0.13)"/>
      <text x="930" y="626" text-anchor="middle">residual</text>
    </g>

    <line x1="782" y1="642" x2="782" y2="656" stroke="#5a6e8c" stroke-width="1.6" marker-end="url(#arrow)"/>

    <rect x="446" y="658" width="672" height="48" rx="9" fill="#16202f" stroke="#38507a"/>
    <circle cx="470" cy="682" r="11" fill="url(#brand)"/>
    <text x="470" y="686" fill="#0b1018" font-size="12" font-weight="700" text-anchor="middle">4</text>
    <text x="492" y="678" fill="#e2e9f4" font-size="13" font-weight="650">inspector.py</text>
    <text x="620" y="678" fill="#8798b0" font-size="11.5">weighted fusion · presence vetoes · scene compensation</text>
    <text x="492" y="696" fill="#6f8099" font-size="11">a false alarm costs more than a missed call, so vetoes cap confidence</text>
  </g>

  <!-- ============ verdict ============ -->
  <line x1="590" y1="740" x2="590" y2="774" stroke="#6e8bff" stroke-width="2" marker-end="url(#arrowBrand)"/>

  <rect x="40" y="780" width="760" height="86" rx="14" fill="#0f1724" stroke="#22304a"/>
  <text x="62" y="806" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">VERDICT, PER NAMED PART</text>
  <g font-size="12.5" font-weight="600">
    <rect x="62" y="820" width="150" height="30" rx="15" fill="rgba(43,212,125,0.14)" stroke="#2bd47d"/>
    <text x="137" y="840" fill="#2bd47d" text-anchor="middle">Present</text>
    <rect x="224" y="820" width="170" height="30" rx="15" fill="rgba(245,165,36,0.14)" stroke="#f5a524"/>
    <text x="309" y="840" fill="#f5a524" text-anchor="middle">Needs review</text>
    <rect x="406" y="820" width="150" height="30" rx="15" fill="rgba(251,93,109,0.14)" stroke="#fb5d6d"/>
    <text x="481" y="840" fill="#fb5d6d" text-anchor="middle">Missing</text>
    <text x="580" y="840" fill="#7e8ea6" font-size="11.5" font-weight="400">+ confidence, reason, evidence breakdown</text>
  </g>

  <!-- ============ disk ============ -->
  <rect x="824" y="780" width="316" height="86" rx="14" fill="#0f1724" stroke="#22304a"/>
  <text x="846" y="806" fill="#9db0ff" font-size="11.5" font-weight="700" letter-spacing="1.2">data/ — ON THIS MACHINE</text>
  <text x="846" y="828" fill="#8798b0" font-size="11.5">reference.png · project.json</text>
  <text x="846" y="848" fill="#8798b0" font-size="11.5">runs/&lt;id&gt;/{test, aligned, crops}</text>

  <path d="M378 598 L424 598" stroke="#5a6e8c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <path d="M982 740 L982 774" stroke="#5a6e8c" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow)"/>

</svg>
